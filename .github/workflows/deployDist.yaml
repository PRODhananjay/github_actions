name: Deploy Dist
# on: [push, workflow_dispatch]
on:
    push:
        branches:
            - main
            - 'feature/**'
        paths-ignore:
            - 'README.md'
            - '.github/workflows/*'
    workflow_dispatch:

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install node 20
              uses: actions/setup-node@v7
              with:
                node-version: 20
            - name: print node version
              run: node -v
            - name: Cachhe dependencies
              uses: actions/cache@v6
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock') }}
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test

    build:
        needs: tests
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install node 20
              uses: actions/setup-node@v7
              with:
                node-version: 20
            - name: Cachhe dependencies
              uses: actions/cache@v6
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock') }}
            - name: Install dependencies
              run: npm ci
            - name: Build dist
              run: npm run build
            - name: Upload Dost Artificat
              uses: actions/upload-artifact@v7
              with:
                name: dist-files
                path: dist
            

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download Dost Artificat
              uses: actions/download-artifact@v8
              with:
                name: dist-files
                path: dist
            - name: Deploy
              run: echo "Deploying Successfully"